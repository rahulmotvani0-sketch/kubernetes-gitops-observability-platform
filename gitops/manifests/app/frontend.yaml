apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-frontend-ui
  namespace: prod
  labels:
    app.kubernetes.io/name: store-frontend-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudnative-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: store-frontend-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-frontend-ui
        app.kubernetes.io/component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["store-frontend-ui"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: store-frontend-service
  namespace: prod
  labels:
    app.kubernetes.io/name: store-frontend-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: store-frontend-ui
