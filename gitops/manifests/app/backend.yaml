apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-backend-api
  namespace: prod
  labels:
    app.kubernetes.io/name: store-backend-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudnative-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: store-backend-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-backend-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["store-backend-api"]
                topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend-api
          image: hashicorp/http-echo:latest
          args:
            - "-text={\"service\":\"store-backend-api\",\"status\":\"healthy\",\"version\":\"v1.2.0\"}"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_HOST
              value: "redis-service.prod.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: store-backend-service
  namespace: prod
  labels:
    app.kubernetes.io/name: store-backend-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: store-backend-api
